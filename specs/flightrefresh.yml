# Source: Sabre Developer Hub MCP · get_spec_file("rest-api/flightrefresh-api/v1")
# https://developer.sabre.com/rest-api/flightrefresh-api/v1
openapi: 3.0.3
info:
  title: Sabre Flight Refresh API
  description: |
    The Sabre Flight Refresh API checks the availability of multiple flight itineraries simultaneously, against Sabre inventory.
  version: '1.0'
x-lingo-api-type: rpc
servers:
  - url: https://{environment}.sabre.com{basePath}
    variables:
      environment:
        default: 'api.cert.platform'
        enum:
          - api.cert.platform
          - api.platform
      basePath:
        default: '/v1/offers'
security:
  - oauth2_authentication:
      []
tags:
  - name: flightRefresh
    description: Multi Source Engine Flight Refresh.
paths:
  /flightRefresh:
    post:
      operationId: flightRefresh
      summary: Supports payload-based batch revalidation of up to 100 itineraries per request.
      description: The API checks the availability of multiple offers, using itinerary details in the payload as input.
      tags:
        - flightRefresh
      requestBody:
        description: Check the availability of multiple flight itineraries using Sabre inventory. Validation includes schedule
          and availability checks only.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlightRefreshRequest'
            examples:
              1. Single itinerary:
                $ref: '#/components/examples/SingleItineraryRequest'
        required: true
      responses:
        '200':
          description: Successful response unless `errors` element is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightRefreshResponse'
              examples:
                1. Single itinerary:
                  $ref: '#/components/examples/SingleItineraryResponse'
                2. Multiple itineraries response with cabin availability information:
                  $ref: '#/components/examples/ItinerariesWithCabinAvailabilityResponse'
components:
  schemas:
    FlightRefreshRequest:
      type: object
      description: Contains itinerary details and traveler information for batch validation including journeys, travelers, and
        processing options.
      required:
        - journeys
        - travelers
        - itineraries
      properties:
        journeys:
          type: array
          minItems: 1
          description: Defines traveler trip criteria.
          items:
            $ref: '#/components/schemas/Journey'
        travelers:
          type: array
          minItems: 1
          maxItems: 9
          description: Defines list of travelers types for which the system is expected to generate offers. In response, an offer
            will be associated to passenger from this list, by an array index.
          items:
            $ref: '#/components/schemas/Traveler'
        processingOptions:
          $ref: '#/components/schemas/ProcessingOptions'
          description: General response options.
        itineraries:
          type: array
          minItems: 1
          maxItems: 100
          description: Lists itinerary details for batch validation.
          items:
            $ref: '#/components/schemas/Itinerary'
    Journey:
      type: object
      description: Contains the requested journey.
      required:
        - departureLocation
        - arrivalLocation
        - departureDate
      properties:
        departureLocation:
          $ref: '#/components/schemas/Location'
          description: Defines a departure city or airport IATA code.
        arrivalLocation:
          $ref: '#/components/schemas/Location'
          description: Defines an arrival city or airport IATA code.
        departureDate:
          type: string
          format: date
          example: '2019-07-09'
          description: The departure date in YYYY-MM-DD format in the city or airport time zone.
    Location:
      type: object
      description: Contains either a city or airport IATA code.
      oneOf:
        - $ref: '#/components/schemas/CityCodeLocation'
        - $ref: '#/components/schemas/AirportCodeLocation'
    Traveler:
      type: object
      required:
        - passengerTypeCode
      properties:
        passengerTypeCode:
          type: string
          pattern: '^[0-9A-Z]{3}$'
          example: 'ADT'
          description: The three-character passenger type code.
    ProcessingOptions:
      type: object
      description: Contains processing options that enable special features of offer generation.
      properties:
        pseudoCityCode:
          type: string
          pattern: '^[A-Z0-9]{3,4}$'
          example: 'PC18'
          description: The unique Point Of Sale identifier (PCC). Applicable to ATPCO.
        configurationId:
          type: string
          minLength: 1
          maxLength: 30
          example: 'abc12345'
          description: The configuration identifier to trigger the desired shopping profile and service.
    Itinerary:
      type: object
      description: Contains a complete flight itinerary with journey details for validation.
      required:
        - journeys
      properties:
        journeys:
          type: array
          minItems: 1
          maxItems: 10
          description: Lists journey details for this itinerary to be validated including flight segments.
          items:
            $ref: '#/components/schemas/ItineraryJourney'
    FlightRefreshResponse:
      type: object
      description: Contains the response with itineraries validation by the API.
      required:
        - timestamp
      properties:
        timestamp:
          type: string
          format: date-time
          example: '2019-09-09T09:09:09Z'
          description: Provides the server timestamp.
        errors:
          type: array
          description: Lists detailed error information. For a successful response, this element won't exist in the response.
          items:
            $ref: '#/components/schemas/Error'
        itineraries:
          type: array
          minItems: 1
          description: Lists validated itineraries and their status.
          items:
            $ref: '#/components/schemas/ItineraryValidationResults'
    BookingClassCodeValidationEnum:
      type: string
      default: 'Unknown'
      example: 'Matched'
      description: Identifies the booking class validation status. Can be Matched, Any other, None, Same cabin or Unknown.
      enum:
        - Matched
        - Same cabin
        - Any other
        - None
        - Unknown
    SeatsPerBookingClassCode:
      type: object
      description: Contains the number of available seats associated with booking class code.
      required:
        - bookingClassCode
        - seatsAvailable
      properties:
        bookingClassCode:
          type: string
          pattern: '^[A-Z]{1,2}$'
          example: 'E'
          description: The code assigned to the booking class; this is sometimes referred to as the reservation booking designator, RBD.
        seatsAvailable:
          type: integer
          format: int32
          minimum: 0
          example: 1
          description: The number of available seats per booking class code.
    FlightAvailabilityInformation:
      type: object
      description: Contains flight availability information.
      required:
        - cabinName
        - bookingClassCodes
      properties:
        cabinName:
          $ref: '#/components/schemas/CabinNameResponseEnum'
          description: Defines the cabin name associated with the specified segment of the journey the fare was calculated for.
        bookingClassCodes:
          type: array
          minItems: 1
          description: Lists the available booking class code with the number of available seats for it.
          items:
            $ref: '#/components/schemas/SeatsPerBookingClassCode'
    JourneyAvailabilityInformation:
      type: object
      description: Contains data for returned flights within journey.
      required:
        - flights
      properties:
        flights:
          type: array
          minItems: 1
          description: Lists detailed availability information per flight.
          items:
            $ref: '#/components/schemas/FlightAvailabilityInformation'
    CabinAvailability:
      type: object
      description: Contains additional information about available cabins for requested itinerary.
      required:
        - journeys
      properties:
        journeys:
          type: array
          minItems: 1
          description: Lists available journeys.
          items:
            $ref: '#/components/schemas/JourneyAvailabilityInformation'
    ItineraryValidationResults:
      type: object
      description: Contains information about the refreshed itinerary. It is still valid if it matches the request booking class.
      required:
        - requestedItineraryIndex
        - isItineraryValid
      properties:
        requestedItineraryIndex:
          type: integer
          format: int32
          example: 1
          description: Reference ID to the itinerary provided in the request.
        isItineraryValid:
          type: boolean
          example: true
          description: If true, the flight schedule was validated against OAG (Flight Database & Statistics | Aviation Analytics)
            filed inventory.
        bookingClassCodeValidation:
          $ref: '#/components/schemas/BookingClassCodeValidationEnum'
          description: Contains the booking class validation status.
        cabinAvailability:
          $ref: '#/components/schemas/CabinAvailability'
          description: Contains additional information about available cabins for requested itinerary.
    CityCodeLocation:
      type: object
      description: Contains a city IATA code.
      properties:
        cityCode:
          type: string
          pattern: '^[A-Z]{3}$'
          example: 'NYC'
          description: City IATA code.
      additionalProperties: false
    AirportCodeLocation:
      type: object
      description: Contains an airport IATA code.
      properties:
        airportCode:
          type: string
          pattern: '^[A-Z]{3}$'
          example: 'DFW'
          description: Airport IATA code.
      additionalProperties: false
    Segment:
      type: object
      description: Contains fare-related details for a specific flight segment.
      required:
        - bookingClassCode
      properties:
        bookingClassCode:
          type: string
          pattern: '^[A-Z]{1,2}$'
          example: 'E'
          description: The Reservation Booking Designator (booking code) applicable to the journey segment for which the fare was
            calculated.
    ItineraryFlight:
      type: object
      description: Contains details of a single flight segment including departure, arrival, and carrier information.
      required:
        - departureAirportCode
        - departureDate
        - departureTime
        - arrivalAirportCode
        - arrivalDate
        - arrivalTime
        - marketingAirlineCode
        - marketingFlightNumber
      properties:
        departureAirportCode:
          type: string
          pattern: '^[A-Z]{3}$'
          example: 'DFW'
          description: The three-letter IATA code of the departure airport.
        departureDate:
          type: string
          format: date
          example: '2024-01-26'
          description: The departure date in the airport time zone.
        departureTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '17:55'
          description: The departure time in the airport time zone.
        arrivalAirportCode:
          type: string
          pattern: '^[A-Z]{3}$'
          example: 'FRA'
          description: The three-letter IATA code of the arrival airport.
        arrivalDate:
          type: string
          format: date
          example: '2024-01-26'
          description: The arrival date in the airport time zone.
        arrivalTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '15:00'
          description: The arrival time in the airport time zone.
        marketingAirlineCode:
          type: string
          pattern: '^([A-Z0-9]{2}|[A-Z]{3})$'
          example: 'AA'
          description: The IATA code of the marketing carrier.
        marketingFlightNumber:
          type: integer
          format: int32
          minimum: 1
          maximum: 9999
          example: 1001
          description: The marketing carrier flight number.
        segmentDetails:
          $ref: '#/components/schemas/Segment'
          description: Fare-related details for a specific flight segment.
    ItineraryJourney:
      type: object
      description: Contains a journey.
      required:
        - flights
      properties:
        flights:
          type: array
          minItems: 1
          maxItems: 10
          description: Lists flights within the journey.
          items:
            $ref: '#/components/schemas/ItineraryFlight'
    Error:
      type: object
      required:
        - category
        - type
      properties:
        category:
          type: string
          example: 'BAD_REQUEST'
          description: A high-level grouping of errors indicating what kind of (client-side or server-side) problem occurred.
        type:
          type: string
          example: 'REQUIRED_FIELD_MISSING'
          description: An application-specific error type, or one from the list of typical Sabre API errors.
        description:
          type: string
          example: 'Client did not provide required data. See fieldName for the item expected in the request.'
          description: A human-readable description of what went wrong with enough information that a software developer can use
            to debug the problem.
        fieldName:
          type: string
          example: 'currencyCode'
          description: Additional information to help debug the error. For example, the name of the parameter missing from a
            request payload.
        fieldPath:
          type: string
          example: 'currencyCode'
          description: Additional information to help debug the error. For example, the name of the parameter missing from a
            request payload.
        fieldValue:
          type: string
          example: 'field value'
          description: The source of the error.
    CabinNameResponseEnum:
      type: string
      default: 'Unknown'
      example: 'Economy'
      description: Identifies the cabin for which the API generated offers.
      enum:
        - Premium First
        - First
        - Premium Business
        - Business
        - Premium Economy
        - Economy
        - Unknown
  examples:
    SingleItineraryRequest:
      value:
        {
          "journeys":
            [
              {
                  "departureLocation": { "cityCode": "DXB" },
                  "arrivalLocation": { "cityCode": "LHR" },
                  "departureDate": "2025-07-26"
                },
              {
                  "departureLocation": { "cityCode": "LHR" },
                  "arrivalLocation": { "cityCode": "DXB" },
                  "departureDate": "2025-07-30"
                }
            ],
          "itineraries":
            [
              {
                  "journeys":
                    [
                      {
                          "flights":
                            [
                              {
                                  "departureAirportCode": "DXB",
                                  "departureDate": "2025-07-26",
                                  "departureTime": "06:30",
                                  "arrivalAirportCode": "AMM",
                                  "arrivalDate": "2025-07-26",
                                  "arrivalTime": "09:00",
                                  "marketingAirlineCode": "RJ",
                                  "marketingFlightNumber": 613,
                                  "segmentDetails": { "bookingClassCode": "M" }
                                },
                              {
                                  "departureAirportCode": "AMM",
                                  "departureDate": "2025-07-27",
                                  "departureTime": "12:00",
                                  "arrivalAirportCode": "LHR",
                                  "arrivalDate": "2025-07-27",
                                  "arrivalTime": "15:20",
                                  "marketingAirlineCode": "RJ",
                                  "marketingFlightNumber": 111,
                                  "segmentDetails": { "bookingClassCode": "M" }
                                }
                            ]
                        },
                      {
                          "flights":
                            [
                              {
                                  "departureAirportCode": "LHR",
                                  "departureDate": "2025-07-30",
                                  "departureTime": "06:30",
                                  "arrivalAirportCode": "AMM",
                                  "arrivalDate": "2025-07-30",
                                  "arrivalTime": "09:00",
                                  "marketingAirlineCode": "RJ",
                                  "marketingFlightNumber": 112,
                                  "segmentDetails": { "bookingClassCode": "M" }
                                },
                              {
                                  "departureAirportCode": "AMM",
                                  "departureDate": "2025-07-30",
                                  "departureTime": "12:00",
                                  "arrivalAirportCode": "DXB",
                                  "arrivalDate": "2025-07-30",
                                  "arrivalTime": "15:20",
                                  "marketingAirlineCode": "RJ",
                                  "marketingFlightNumber": 610,
                                  "segmentDetails": { "bookingClassCode": "M" }
                                }
                            ]
                        }
                    ]
                }
            ],
          "travelers": [ { "passengerTypeCode": "ADT" } ],
          "processingOptions": { "pseudoCityCode": "PC18", "configurationId": "abc12345" }
        }

    SingleItineraryResponse:
      value:
        {
          "timestamp": "2025-09-09T09:09:09Z",
          "itineraries":
            [
              {
                  "requestedItineraryIndex": 0,
                  "isItineraryValid": true,
                  "bookingClassCodeValidation": "Matched"
                }
            ]
        }
    ItinerariesWithCabinAvailabilityResponse:
      value:
        {
          "timestamp": "2025-12-12T09:10:00Z",
          "itineraries":
            [
              {
                  "requestedItineraryIndex": 0,
                  "isItineraryValid": true,
                  "bookingClassCodeValidation": "Matched",
                  "cabinAvailability":
                    {
                      "journeys":
                        [
                          {
                              "flights":
                                [
                                  {
                                      "cabinName": "Economy",
                                      "bookingClassCodes":
                                        [
                                          { "bookingClassCode": "J", "seatsAvailable": 4 },
                                          { "bookingClassCode": "C", "seatsAvailable": 5 }
                                        ]
                                    }
                                ]
                            }
                        ]
                    }
                },
              {
                  "requestedItineraryIndex": 1,
                  "isItineraryValid": true,
                  "bookingClassCodeValidation": "Same cabin",
                  "cabinAvailability":
                    {
                      "journeys":
                        [
                          {
                              "flights":
                                [
                                  {
                                      "cabinName": "Economy",
                                      "bookingClassCodes":
                                        [
                                          { "bookingClassCode": "J", "seatsAvailable": 4 },
                                          { "bookingClassCode": "C", "seatsAvailable": 5 }
                                        ]
                                    }
                                ]
                            }
                        ]
                    }
                },
              {
                  "requestedItineraryIndex": 2,
                  "isItineraryValid": true,
                  "bookingClassCodeValidation": "Any other"
                }
            ]
        }
  securitySchemes:
    oauth2_authentication:
      type: oauth2
      x-base64-encode-client-credentials: true
      flows:
        clientCredentials:
          tokenUrl: https://api.cert.platform.sabre.com/v2/auth/token
          scopes:
            {}
